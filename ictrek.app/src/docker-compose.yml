x-comfyui-env: &comfyui-env
  COMFYUI_VERSION: "__APP_VERSION__"
  COMFYUI_MAX_WORKERS: "${COMFYUI_MAX_WORKERS:-1}"
  VOS_USERINFO_URL: http://${VOS_HOST_GW_IP}:${VOS_API_GW_PORT_INTERNAL}/v1000/oauth2/userinfo
  COMFYUI_MODEL_HUB_URL: http://v-scheduler-model-hub:6005

x-comfyui: &comfyui
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
  volumes:
    - ${VOS_APP_STORAGE_PATH}/data:/data
    - ${MODEL_HUB_SHARED_MODELS_PATH:-/data/vos_workspace/model_hub}:/modelhub:ro
  networks:
    vos_default:
      aliases: [comfyui, comfyui-frontend, comfyui-backend]
  labels:
    traefik.enable: "true"
    traefik.docker.network: vos_default
    traefik.http.routers.comfyui.rule: PathPrefix(`/app/com.ictrek.comfyui/`)
    traefik.http.services.comfyui.loadbalancer.server.port: "8188"
    traefik.http.routers.comfyui-top-open.rule: (Path(`/app/com.ictrek.comfyui`) || Path(`/app/com.ictrek.comfyui/`)) && HeaderRegexp(`Sec-Fetch-Dest`, `document`)
    traefik.http.routers.comfyui-top-open.priority: "1000"
    traefik.http.routers.comfyui-top-open.service: comfyui
    traefik.http.routers.comfyui-top-open.middlewares: comfyui-redirect
    traefik.http.middlewares.comfyui-redirect.redirectregex.regex: '^(https?://[^/]+)/app/com\.ictrek\.comfyui/?(?:\?.*)?$'
    traefik.http.middlewares.comfyui-redirect.redirectregex.replacement: '$${1}${ROUTER_HASH_PATH:-/#/app/app-drawer/com.ictrek.comfyui/comfyui}'
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/health', timeout=3)"]
    interval: 30s
    timeout: 5s
    start_period: 15s
    retries: 3

x-comfyui-gpu-env: &comfyui-gpu-env
  <<: *comfyui-env
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility

services:
  comfyui-amd:
    <<: *comfyui
    profiles: [amd]
    image: ${COMFYUI_AMD_IMAGE}
    runtime: nvidia
    environment:
      <<: *comfyui-gpu-env
      COMFYUI_DEVICE: cuda
  comfyui-amd-without-cuda:
    <<: *comfyui
    profiles: [amd-without-cuda]
    image: ${COMFYUI_AMD_WITHOUT_CUDA_IMAGE}
    environment:
      <<: *comfyui-env
      COMFYUI_DEVICE: cpu
  comfyui-arm:
    <<: *comfyui
    profiles: [arm]
    image: ${COMFYUI_ARM_IMAGE}
    runtime: nvidia
    environment:
      <<: *comfyui-gpu-env
      COMFYUI_DEVICE: cuda
  comfyui-arm-without-cuda:
    <<: *comfyui
    profiles: [arm-without-cuda]
    image: ${COMFYUI_ARM_WITHOUT_CUDA_IMAGE}
    environment:
      <<: *comfyui-env
      COMFYUI_DEVICE: cpu
  comfyui-l4t:
    <<: *comfyui
    profiles: [l4t]
    image: ${COMFYUI_L4T_IMAGE}
    runtime: nvidia
    environment:
      <<: *comfyui-gpu-env
      COMFYUI_DEVICE: l4t
  comfyui-thor-spark:
    <<: *comfyui
    profiles: [thor-spark]
    image: ${COMFYUI_THOR_SPARK_IMAGE}
    runtime: nvidia
    environment:
      <<: *comfyui-gpu-env
      COMFYUI_DEVICE: cuda

networks:
  vos_default:
    external: true
