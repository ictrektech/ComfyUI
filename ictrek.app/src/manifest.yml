id: com.ictrek.comfyui
name: {zh-CN: ComfyUI, en: ComfyUI}
description:
  zh-CN: 本地节点式图像与视频工作流，支持 VOS 账户和 V-Scheduler 共享模型。
  en: Local node-based image and video workflows with VOS accounts and V-Scheduler shared models.
version: __APP_VERSION__
author: ictrek
category: [ai]
icon: icon.png
arch: [amd64, arm64]
platform:
  version: ">=3.0.0"
oauth2:
  client:
    id: com.ictrek.comfyui
    client_type: public
    redirect_uris: [https://app.vos-platform.internal/callback]
    grant_types: [authorization_code, refresh_token]
    response_types: [code]
    scopes: [openid, profile, email]
    pkce_required: true
    token_endpoint_auth_method: none
dependencies:
  apps:
    - id: com.ictrek.v-scheduler
      version: __V_SCHEDULER_DEPENDENCY__
      optional: false
    - id: com.ictrek.image-studio
      version: "*"
      optional: true
storage:
  directories:
    - path: data
      uid: 0
      gid: 0
      mode: "0711"
require-profiles: true
profiles:
  - name: amd-cuda
    title: {zh-CN: "AMD64 NVIDIA CUDA 12.8", en: "AMD64 NVIDIA CUDA 12.8"}
    description:
      zh-CN: 适用于配有 NVIDIA GPU 且支持 CUDA 12.8 的 AMD64 设备。
      en: For AMD64 devices with an NVIDIA GPU and CUDA 12.8 support.
    caps:
      arch: amd64
      software: [cuda]
    conflicts: [amd-cpu, arm-cuda, arm-cpu, jetson-orin, jetson-thor, dgx-spark]
  - name: amd-cpu
    title: {zh-CN: "AMD64 CPU", en: "AMD64 CPU"}
    description:
      zh-CN: 在 AMD64 设备上使用 CPU 执行工作流。
      en: Runs workflows on the CPU on AMD64 devices.
    caps:
      arch: amd64
    conflicts: [amd-cuda, arm-cuda, arm-cpu, jetson-orin, jetson-thor, dgx-spark]
  - name: arm-cuda
    title: {zh-CN: "ARM64 NVIDIA CUDA 13.0", en: "ARM64 NVIDIA CUDA 13.0"}
    description:
      zh-CN: 适用于配有 NVIDIA GPU 且支持 CUDA 13.0 的通用 ARM64 设备。
      en: For generic ARM64 devices with an NVIDIA GPU and CUDA 13.0 support.
    caps:
      arch: arm64
      software: [cuda]
      device-type: generic
    conflicts: [amd-cuda, amd-cpu, arm-cpu, jetson-orin, jetson-thor, dgx-spark]
  - name: arm-cpu
    title: {zh-CN: "ARM64 CPU", en: "ARM64 CPU"}
    description:
      zh-CN: 在 ARM64 设备上使用 CPU 执行工作流。
      en: Runs workflows on the CPU on ARM64 devices.
    caps:
      arch: arm64
    conflicts: [amd-cuda, amd-cpu, arm-cuda, jetson-orin, jetson-thor, dgx-spark]
  - name: jetson-orin
    title: {zh-CN: "ARM64 Jetson Orin / L4T", en: "ARM64 Jetson Orin / L4T"}
    description:
      zh-CN: 适用于运行 L4T 的 Jetson Orin 设备。
      en: For Jetson Orin devices running L4T.
    caps:
      arch: arm64
      software: [cuda]
      device-type:
        - any-of: [jetson-orin, l4t, jetson]
    conflicts: [amd-cuda, amd-cpu, arm-cuda, arm-cpu, jetson-thor, dgx-spark]
  - name: jetson-thor
    title: {zh-CN: "ARM64 Jetson Thor", en: "ARM64 Jetson Thor"}
    description:
      zh-CN: 适用于支持 CUDA 13.0 的 Jetson Thor。
      en: For Jetson Thor devices with CUDA 13.0 support.
    caps:
      arch: arm64
      software: [cuda]
      device-type:
        - any-of: [jetson-thor, thor, thor-spark]
    conflicts: [amd-cuda, amd-cpu, arm-cuda, arm-cpu, jetson-orin, dgx-spark]
  - name: dgx-spark
    title: {zh-CN: "ARM64 DGX Spark", en: "ARM64 DGX Spark"}
    description:
      zh-CN: 适用于支持 CUDA 13.0 的 DGX Spark。
      en: For DGX Spark devices with CUDA 13.0 support.
    caps:
      arch: arm64
      software: [cuda]
      device-type:
        - any-of: [dgx-spark, spark]
    conflicts: [amd-cuda, amd-cpu, arm-cuda, arm-cpu, jetson-orin, jetson-thor]
